<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
<title>Der Wortschatzkasten</title>
<meta name="theme-color" content="#12161B" media="(prefers-color-scheme: dark)" />
<meta name="theme-color" content="#EBEDEF" media="(prefers-color-scheme: light)" />
<meta name="description" content="Il lessico di tedesco, sempre in tasca: schede, ripasso a intervalli ed esercizi." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Wortschatz" />
<style>
/* ---------------------------------------------------------------
   Der Wortschatzkasten — foglio di stile unico, nessuna dipendenza.
   Il colore porta un'informazione sola: il genere del sostantivo.
   der = blu · die = magenta · das = verde
----------------------------------------------------------------*/
:root {
  --bg: #EBEDEF;
  --surface: #FFFFFF;
  --surface-2: #F2F4F6;
  --ink: #12161B;
  --ink-2: #5C6771;
  --ink-3: #8A959F;
  --line: #D8DDE2;
  --line-strong: #BCC5CC;
  --der: #2A5BD7;
  --die: #C02F60;
  --das: #14795A;
  --neutral: #4A5560;
  --flag: #C98A00;
  --flag-bg: #FBEFC9;
  --ok: #14795A;
  --ok-bg: #DDF0E8;
  --err: #C02F60;
  --err-bg: #FBE3EA;
  --shadow: 0 1px 2px rgba(18,22,27,.06), 0 8px 24px -16px rgba(18,22,27,.4);
  --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --font-serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  --r: 10px;
  --tap: 44px;
}
html[data-theme="dark"] {
  --bg: #0F1318;
  --surface: #181D24;
  --surface-2: #212932;
  --ink: #E9EDF1;
  --ink-2: #9AA6B2;
  --ink-3: #74808C;
  --line: #2B343E;
  --line-strong: #3B4653;
  --der: #7CA4FF;
  --die: #FF87AC;
  --das: #4FC79C;
  --neutral: #A9B4BF;
  --flag: #EFC14E;
  --flag-bg: #3A3013;
  --ok: #4FC79C;
  --ok-bg: #13332A;
  --err: #FF87AC;
  --err-bg: #3A1B26;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.9);
}

/* --- Pergamena: carta calda, inchiostro seppia, oro. Per leggere di sera. --- */
html[data-theme="pergamena"] {
  --bg: #EFE7D5;
  --surface: #FAF5E9;
  --surface-2: #F2EADA;
  --ink: #2A2115;
  --ink-2: #6A5B45;
  --ink-3: #94856D;
  --line: #DCCDAF;
  --line-strong: #C4B08B;
  --der: #1F5E9E;
  --die: #A82F52;
  --das: #3E6F33;
  --neutral: #6A5B45;
  --flag: #A8761A;
  --flag-bg: #F3E4C1;
  --ok: #3E6F33;
  --ok-bg: #E2EBD5;
  --err: #A82F52;
  --err-bg: #F5DCE1;
  --shadow: 0 1px 2px rgba(74,58,32,.10), 0 8px 22px -16px rgba(74,58,32,.7);
}

/* --- Notte blu: l'ora blu di Berlino. Scuro ma non nero. --- */
html[data-theme="notte"] {
  --bg: #0A1526;
  --surface: #12223A;
  --surface-2: #1B2F4D;
  --ink: #E7EEFA;
  --ink-2: #9BB0D0;
  --ink-3: #6F87AB;
  --line: #22385A;
  --line-strong: #34537D;
  --der: #79B4FF;
  --die: #FF8FB8;
  --das: #4FD3A6;
  --neutral: #9BB0D0;
  --flag: #F2C75C;
  --flag-bg: #3B3213;
  --ok: #4FD3A6;
  --ok-bg: #10382C;
  --err: #FF8FB8;
  --err-bg: #3C1B2A;
  --shadow: 0 1px 2px rgba(0,0,0,.5), 0 12px 28px -18px rgba(0,0,0,1);
}

/* --- Menta: chiaro e freddo, per studiare di giorno senza affaticare. --- */
html[data-theme="menta"] {
  --bg: #DDEDE4;
  --surface: #FFFFFF;
  --surface-2: #EDF6F1;
  --ink: #0F2119;
  --ink-2: #4A6459;
  --ink-3: #7B9389;
  --line: #C6DED2;
  --line-strong: #A5C6B6;
  --der: #1F53C9;
  --die: #BC2B62;
  --das: #0E7A54;
  --neutral: #4A6459;
  --flag: #B07700;
  --flag-bg: #F7E7C4;
  --ok: #0E7A54;
  --ok-bg: #D3EDE0;
  --err: #BC2B62;
  --err-bg: #FADCE5;
  --shadow: 0 1px 2px rgba(15,33,25,.07), 0 8px 24px -16px rgba(15,33,25,.45);
}

/* --- Oceano: blu profondo, per chi ripassa con la testa fredda. --- */
html[data-theme="oceano"] {
  --bg: #0B1E3B;
  --surface: #142B52;
  --surface-2: #1B3763;
  --ink: #E9F1FF;
  --ink-2: #9DB6DE;
  --ink-3: #6E89B4;
  --line: #24406E;
  --line-strong: #345683;
  --der: #6FB3FF;
  --die: #FF9BC2;
  --das: #52D6B0;
  --neutral: #9DB6DE;
  --flag: #F4C363;
  --flag-bg: #3A2E12;
  --ok: #52D6B0;
  --ok-bg: #103A30;
  --err: #FF9BC2;
  --err-bg: #3E1D2B;
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 12px 28px -18px rgba(0,0,0,1);
}

/* --- Vulcano: rosso caldo e materico, per un ripasso energico. --- */
html[data-theme="vulcano"] {
  --bg: #FCEEE9;
  --surface: #FFFFFF;
  --surface-2: #FBE0D6;
  --ink: #3A140A;
  --ink-2: #8A4531;
  --ink-3: #B57459;
  --line: #F0CBBB;
  --line-strong: #E0AA92;
  --der: #B33E1E;
  --die: #C8285A;
  --das: #3E7A3C;
  --neutral: #8A4531;
  --flag: #B4790E;
  --flag-bg: #FBE7C4;
  --ok: #3E7A3C;
  --ok-bg: #E1EFDA;
  --err: #C8285A;
  --err-bg: #FAD9E2;
  --shadow: 0 1px 2px rgba(58,20,10,.10), 0 8px 24px -16px rgba(58,20,10,.5);
}

/* --- Ametista: viola profondo, morbido per le sessioni serali. --- */
html[data-theme="ametista"] {
  --bg: #1C1330;
  --surface: #281B44;
  --surface-2: #33234F;
  --ink: #F0E9FF;
  --ink-2: #B7A6DE;
  --ink-3: #8B76B0;
  --line: #3D2C5C;
  --line-strong: #513D75;
  --der: #8FA6FF;
  --die: #FF8FD1;
  --das: #55D9A6;
  --neutral: #B7A6DE;
  --flag: #F0C868;
  --flag-bg: #3A3016;
  --ok: #55D9A6;
  --ok-bg: #12362C;
  --err: #FF8FD1;
  --err-bg: #3C1D33;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -18px rgba(0,0,0,1);
}

/* --- Sakura: rosa chiaro e luminoso, delicato per lo studio diurno. --- */
html[data-theme="sakura"] {
  --bg: #FDECF1;
  --surface: #FFFFFF;
  --surface-2: #FCE0E9;
  --ink: #3A1220;
  --ink-2: #8A4E62;
  --ink-3: #B57F92;
  --line: #F3CBDA;
  --line-strong: #E4A9C0;
  --der: #3E63C9;
  --die: #C6296B;
  --das: #2E8F6E;
  --neutral: #8A4E62;
  --flag: #B8790F;
  --flag-bg: #FBE7C4;
  --ok: #2E8F6E;
  --ok-bg: #DCF0E7;
  --err: #C6296B;
  --err-bg: #FAD9E5;
  --shadow: 0 1px 2px rgba(58,18,32,.08), 0 8px 24px -16px rgba(58,18,32,.45);
}

/* --- Ambra: arancio caldo al tramonto, per un ripasso avvolgente. --- */
html[data-theme="ambra"] {
  --bg: #FBEEDD;
  --surface: #FFFDF8;
  --surface-2: #F7E2C4;
  --ink: #3A2408;
  --ink-2: #8A6535;
  --ink-3: #B5936A;
  --line: #EFD4A8;
  --line-strong: #DEB877;
  --der: #2E63B0;
  --die: #C23E63;
  --das: #4A7A2E;
  --neutral: #8A6535;
  --flag: #C77400;
  --flag-bg: #FBE3B8;
  --ok: #4A7A2E;
  --ok-bg: #E4EFD5;
  --err: #C23E63;
  --err-bg: #FAD9E2;
  --shadow: 0 1px 2px rgba(58,36,8,.10), 0 8px 24px -16px rgba(58,36,8,.5);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 1.45;
  overscroll-behavior-y: none;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--der); outline-offset: 2px; border-radius: 4px; }
::selection { background: var(--flag-bg); color: var(--ink); }

/* ---------- impalcatura ---------- */
.app {
  min-height: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 0 16px calc(84px + env(safe-area-inset-bottom));
}
.topbar {
  position: sticky; top: 0; z-index: 20;
  background: var(--bg);
  padding: calc(12px + env(safe-area-inset-top)) 0 10px;
  display: flex; align-items: flex-start; gap: 12px;
  border-bottom: 1px solid transparent;
  transition: border-color .15s ease;
}
.topbar.scrolled { border-bottom-color: var(--line); }
.brand h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.03em;
}
.brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--ink-2); }
.topbar-actions { margin-left: auto; display: flex; gap: 6px; }
.iconbtn {
  height: 38px; min-width: 38px; padding: 0 12px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; color: var(--ink-2);
  font-size: 13px; font-weight: 600;
}
.iconbtn:active { background: var(--surface-2); }
.iconbtn.on { color: var(--ink); border-color: var(--line-strong); }

/* ---------- barra inferiore ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; background: none; border: 0;
  padding: 9px 2px 8px;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-3); font-size: 11px; font-weight: 600;
  position: relative;
}
.tab svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--ink); }
.tab .badge {
  position: absolute; top: 4px; left: 50%; margin-left: 6px;
  min-width: 17px; height: 17px; padding: 0 4px;
  background: var(--die); color: #fff;
  border-radius: 999px; font-size: 10px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}

/* ---------- ricerca e filtri ---------- */
.searchrow { display: flex; gap: 8px; margin-top: 4px; }
.search {
  flex: 1; display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r); padding: 0 10px; height: var(--tap);
}
.search svg { width: 17px; height: 17px; stroke: var(--ink-3); fill: none; stroke-width: 2; flex: none; }
.search input { flex: 1; border: 0; background: none; outline: none; font-size: 16px; min-width: 0; }
.search input::placeholder { color: var(--ink-3); }
.search button { border: 0; background: none; color: var(--ink-3); padding: 6px; line-height: 1; }
.chiprow {
  display: flex; gap: 6px; margin-top: 10px;
  overflow-x: auto; scrollbar-width: none;
  padding-bottom: 2px;
}
.chiprow::-webkit-scrollbar { display: none; }
.chip {
  flex: none; height: 34px; padding: 0 13px;
  display: inline-flex; align-items: center; gap: 6px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--ink-2);
  white-space: nowrap;
}
.chip.on { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.chip .n { font-weight: 500; opacity: .6; font-variant-numeric: tabular-nums; }
.chip.flagchip.on { background: var(--flag); border-color: var(--flag); color: #1B1405; }
.chip.clearchip { padding: 0 11px; color: var(--ink-3); font-weight: 500; opacity: .7; }
.chip.clearchip:active { opacity: 1; }
.chip.browsechip { padding: 0 10px; color: var(--ink-3); }
.chip.browsechip svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; display: block; }
.pick .n { font-weight: 500; opacity: .6; font-variant-numeric: tabular-nums; }
.resultline {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 10px; margin: 16px 0 8px;
  font-size: 12.5px; color: var(--ink-2);
}
.linkbtn { background: none; border: 0; color: var(--ink-2); font-size: 12.5px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; padding: 4px 0; }

/* ---------- lista lessico ---------- */
.list { display: flex; flex-direction: column; gap: 7px; }
.group-h {
  margin: 20px 0 8px; padding-bottom: 5px;
  font-size: 12.5px; font-weight: 700; letter-spacing: .01em;
  color: var(--ink-2); border-bottom: 1px solid var(--line);
  display: flex; justify-content: space-between;
}
.entry {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 4px solid var(--g, var(--neutral));
  border-radius: var(--r);
  padding: 11px 12px 11px 13px;
  display: grid; grid-template-columns: 1fr auto; gap: 4px 10px;
  align-items: start;
  text-align: left; width: 100%;
  font-family: inherit;
}
.entry.open { box-shadow: var(--shadow); }
.entry .lemma {
  background: none; border: 0; padding: 0; margin: 0;
  text-align: left; color: inherit; font-family: inherit; cursor: pointer;
  font-size: 17px; font-weight: 650; letter-spacing: -.015em;
  line-height: 1.25; word-break: break-word;
}
.entry .art { color: var(--g, var(--neutral)); font-weight: 700; }
.entry .gloss {
  font-family: var(--font-serif); font-size: 14.5px;
  color: var(--ink-2); line-height: 1.35; margin-top: 2px;
}
.entry .meta { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.pill {
  font-size: 11px; font-weight: 600; color: var(--ink-2);
  background: var(--surface-2); border-radius: 5px; padding: 2px 6px;
}
.pill.type { color: var(--g, var(--neutral)); background: color-mix(in srgb, var(--g, var(--neutral)) 11%, transparent); }
.entry .side { display: flex; flex-direction: column; align-items: center; gap: 2px; grid-row: span 2; }
.flagbtn {
  border: 0; background: none; padding: 7px; line-height: 0; border-radius: 8px;
  color: var(--ink-3);
}
.flagbtn svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.flagbtn.on { color: var(--flag); }
.flagbtn.on svg { fill: var(--flag); }
.mastery {
  width: 26px; height: 3px; border-radius: 2px;
  background: var(--line); overflow: hidden;
}
.mastery i { display: block; height: 100%; background: var(--das); }
.detail {
  grid-column: 1 / -1; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 14px; display: flex; flex-direction: column; gap: 5px;
}
.detail dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 13.5px; }
.detail dt { color: var(--ink-3); font-weight: 600; }
.detail dd { margin: 0; }
.detail .note { font-size: 13px; color: var(--ink-2); }
.detail .example {
  font-family: var(--font-serif); font-size: 14px;
  border-left: 2px solid var(--line-strong); padding-left: 10px; margin-top: 2px;
}
.detail .example em { display: block; font-style: normal; color: var(--ink-2); font-size: 13px; }
.detail-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.tinybtn {
  height: 34px; padding: 0 11px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface-2);
  font-size: 12.5px; font-weight: 600; color: var(--ink-2);
  display: inline-flex; align-items: center; gap: 6px;
}
.tinybtn.danger { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, var(--line)); }
.tinybtn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; }

/* ---------- stati vuoti ---------- */
.empty {
  text-align: center; padding: 44px 16px; color: var(--ink-2);
}
.empty strong { display: block; font-size: 16px; color: var(--ink); margin-bottom: 5px; }
.empty p { margin: 0 0 14px; font-size: 14px; }

/* ---------- pulsanti principali ---------- */
.btn {
  height: 46px; padding: 0 18px; border-radius: var(--r);
  border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
  font-size: 15px; font-weight: 650;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:active { opacity: .85; }
.btn.ghost { background: var(--surface); color: var(--ink); border-color: var(--line-strong); }
.btn.block { display: flex; width: 100%; }
.btn[disabled] { opacity: .45; }
.fab {
  position: fixed; right: max(16px, calc(50% - 344px));
  bottom: calc(72px + env(safe-area-inset-bottom));
  z-index: 25; height: 50px; padding: 0 18px;
  border-radius: 999px; border: 0;
  background: var(--ink); color: var(--bg);
  font-size: 14.5px; font-weight: 650;
  display: inline-flex; align-items: center; gap: 7px;
  box-shadow: 0 6px 20px -6px rgba(18,22,27,.5);
}

/* ---------- ripasso ---------- */
.review-head { margin-top: 12px; }
.dueline { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dueline .big { font-size: 34px; font-weight: 700; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.dueline .lbl { font-size: 13.5px; color: var(--ink-2); line-height: 1.25; }
.progressbar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 14px 0 12px; }
.progressbar i { display: block; height: 100%; background: var(--ink); transition: width .25s ease; }
.cardstage { perspective: 1200px; margin-top: 4px; }
.flip { position: relative; transition: transform .38s cubic-bezier(.2,.75,.3,1); transform-style: preserve-3d; }
.flip.flipped { transform: rotateY(180deg); }
.face {
  min-height: 250px; width: 100%;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; box-shadow: var(--shadow);
  padding: 26px 20px; text-align: center;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.face.back { position: absolute; inset: 0; transform: rotateY(180deg); overflow-y: auto; }
.face .lemma-xl { font-size: 29px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; }
.face .lemma-xl .art { color: var(--g, var(--neutral)); }
.face .gloss-xl { font-family: var(--font-serif); font-size: 22px; line-height: 1.3; }
.face .sub { font-size: 13.5px; color: var(--ink-2); }
.face .forms { font-size: 13.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.face .ex { font-family: var(--font-serif); font-size: 14px; color: var(--ink-2); max-width: 34ch; }
.hint { text-align: center; font-size: 12px; color: var(--ink-3); margin-top: 10px; }
.grades { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.grade {
  height: 52px; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--surface); font-size: 13.5px; font-weight: 650;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.grade small { font-weight: 500; font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.grade.g0 { color: var(--err); }
.grade.g1 { color: var(--flag); }
.grade.g2 { color: var(--ok); }
.speak { border: 0; background: none; color: var(--ink-3); padding: 8px; line-height: 0; border-radius: 999px; }
.speak svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.cardtools { display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px; }
.sessiondone { text-align: center; padding: 30px 10px; }
.sessiondone .big { font-size: 42px; font-weight: 700; letter-spacing: -.03em; }
.statgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px 0; }
.statbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 10px; text-align: center; }
.statbox b { display: block; font-size: 22px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.statbox b .flame { margin-left: 3px; vertical-align: -4px; }
.statbox span { font-size: 11.5px; color: var(--ink-2); }

/* ---------- quiz ---------- */
.qcard {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: 14px; padding: 22px 18px; box-shadow: var(--shadow);
  text-align: center; margin-top: 12px;
}
.qprompt { font-size: 13px; color: var(--ink-3); margin-bottom: 8px; }
.qword { font-size: 26px; font-weight: 700; letter-spacing: -.03em; line-height: 1.2; }
.qword.serif { font-family: var(--font-serif); font-weight: 600; letter-spacing: 0; }
.qopts { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }
.qopt {
  min-height: var(--tap); padding: 11px 14px; border-radius: var(--r);
  border: 1px solid var(--line); background: var(--surface-2);
  font-family: var(--font-serif); font-size: 15px; text-align: left;
  display: flex; align-items: center; gap: 9px;
}
.qopt .k { font-family: var(--font-sans); font-size: 11px; font-weight: 700; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; flex: none; }
.qopt.right { background: var(--ok-bg); border-color: var(--ok); color: var(--ink); }
.qopt.wrongpick { background: var(--err-bg); border-color: var(--err); }
.qopt.art { font-family: var(--font-sans); font-weight: 700; font-size: 17px; justify-content: center; }
.qinput {
  width: 100%; height: var(--tap); margin-top: 16px; text-align: center;
  border: 1px solid var(--line-strong); border-radius: var(--r);
  background: var(--surface-2); font-size: 18px; font-weight: 600; outline: none;
}
.qinput.right { border-color: var(--ok); background: var(--ok-bg); }
.qinput.wrongpick { border-color: var(--err); background: var(--err-bg); }
.umlauts { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
.umlauts button { width: 42px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; font-weight: 600; }
.verdict { margin-top: 14px; font-size: 14px; }
.verdict b { display: block; font-size: 15px; margin-bottom: 2px; }
.verdict.ok b { color: var(--ok); }
.verdict.no b { color: var(--err); }
.scorerow { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 13px; color: var(--ink-2); }
.scorerow .streak { color: var(--flag); font-weight: 650; }
/* la fiamma della streak: cambia colore ogni tot giorni, poi ricomincia dal rosso */
.flame { display: inline-flex; width: 22px; height: 22px; animation: flameflicker 1.6s ease-in-out infinite; }
.flame svg { width: 100%; height: 100%; fill: currentColor; }
.flame-red, .flame.flame-red { color: #E5482B; }
.flame-blue, .flame.flame-blue { color: #2547B8; }
.flame-green, .flame.flame-green { color: #1F9D55; }
.flame-violet, .flame.flame-violet { color: #8B3FE0; }
.flame-crystal, .flame.flame-crystal { color: #CFEFFF; filter: drop-shadow(0 0 3px #FFFFFF); }
/* oggi non è ancora stata fatta nessuna azione valida: fiamma grigia e ferma */
.flame.flame-idle { color: #A39B8E; filter: none; animation: none; opacity: .85; }
@keyframes flameflicker {
  0%, 100% { transform: scale(1) rotate(-2deg); opacity: .9; }
  50% { transform: scale(1.1) rotate(2deg); opacity: 1; }
}

/* ---------- impostazioni: righe con interruttore, sezioni a tendina, rotella ---------- */
.setgroup { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 10px; }
.setgroup > summary {
  list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px;
  min-height: var(--tap); padding: 10px 13px; font-size: 14px; font-weight: 700;
}
.setgroup > summary::-webkit-details-marker { display: none; }
.setgroup > summary small { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--ink-3); }
.setgroup > summary::after {
  content: ""; width: 8px; height: 8px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3);
  transform: rotate(45deg) translate(-2px,-2px); transition: transform .2s; flex: none;
}
.setgroup[open] > summary::after { transform: rotate(225deg) translate(-2px,-1px); }
.setgroup-body { padding: 2px 13px 12px; border-top: 1px solid var(--line); }
.setrow { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .txt { flex: 1; min-width: 0; }
.setrow .txt b { display: block; font-size: 13.5px; font-weight: 600; }
.setrow .txt small { display: block; font-size: 12px; color: var(--ink-3); line-height: 1.4; margin-top: 2px; }
.setrow.dim .txt, .setrow.dim .wheelbox { opacity: .45; }
.setrow select, .setrow input[type=time] {
  font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--surface-2); color: var(--ink); min-height: 38px;
}
.setnote { font-size: 12.5px; color: var(--ink-3); line-height: 1.45; margin: 8px 0 0; }
.setbtns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.setbtns .btn { flex: 1 1 auto; min-width: 140px; }
.bkstatus { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; margin-top: 10px; padding: 10px 12px; background: var(--surface-2); border-radius: 8px; }
.bkstatus.warn { background: var(--flag-bg); color: var(--ink); }
.wheelbox { display: flex; align-items: center; gap: 6px; flex: none; }
.wheel {
  position: relative; width: 64px; height: 84px; overflow-y: scroll; scroll-snap-type: y mandatory;
  scrollbar-width: none; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line-strong);
  -webkit-mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
  mask-image: linear-gradient(transparent, #000 32%, #000 68%, transparent);
  overscroll-behavior: contain; touch-action: pan-y;
}
.wheel::-webkit-scrollbar { display: none; }
.wheel-pad { height: 28px; }
.wheel-i {
  height: 28px; line-height: 28px; text-align: center; scroll-snap-align: center;
  font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; color: var(--ink-3);
  transition: transform .18s ease, color .18s ease, font-size .18s ease;
}
.wheel-i.sel { color: var(--ink); font-size: 20px; font-weight: 800; transform: scale(1.05); }
.wheelmark { position: relative; }
.wheelbox .wl { font-size: 11.5px; color: var(--ink-3); max-width: 64px; line-height: 1.2; }

/* ---------- progressi: tempo e bilancio ---------- */
.timecard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; margin-top: 4px; }
.timecard .big { font-size: 30px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; margin: 10px 0 2px; }
.timecard .sub { font-size: 12px; color: var(--ink-3); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.seg button { background: transparent; border: 0; font-family: inherit; padding: 8px 2px; border-radius: 8px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); min-height: 36px; transition: background .2s, color .2s; }
.seg button.on { background: var(--ink); color: var(--bg); }
.bal { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.bal-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line); }
.bal-net { font-size: 26px; font-weight: 800; letter-spacing: -.03em; font-variant-numeric: tabular-nums; display: flex; align-items: center; gap: 6px; }
.bal-head small { color: var(--ink-3); font-size: 12px; line-height: 1.35; }
.bal-scroll { max-height: 214px; overflow-y: auto; overscroll-behavior: contain; padding: 4px 0; }
.bal-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; font-size: 13.5px; }
.bal-row + .bal-row { border-top: 1px solid var(--line); }
.bal-row .lbl { flex: 1; min-width: 0; }
.bal-row .lbl small { display: block; color: var(--ink-3); font-size: 11.5px; }
.bal-row b { font-variant-numeric: tabular-nums; font-size: 15px; }
.bal-sub { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-3); padding: 10px 14px 4px; background: var(--surface-2); }
.tick { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 7px; flex: none; }
.tick svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.up { color: var(--ok); } .down { color: var(--err); } .flat { color: var(--ink-3); }
.tick.up { background: var(--ok-bg); } .tick.down { background: var(--err-bg); } .tick.flat { background: var(--surface-2); }
.bal-day { display: flex; align-items: center; gap: 10px; padding: 7px 14px; font-size: 13px; }
.bal-day .d { width: 64px; color: var(--ink-2); }
.bal-day .bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); position: relative; overflow: hidden; }
.bal-day .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bal-day .bar i.up { background: var(--ok); left: 50%; } .bal-day .bar i.down { background: var(--err); right: 50%; }
.bal-day b { width: 40px; text-align: right; font-variant-numeric: tabular-nums; }

/* ---------- streak a schermo intero ---------- */
.statbox[data-act="streak"] { cursor: pointer; transition: transform .12s; }
.statbox[data-act="streak"]:active { transform: scale(.96); }
#streakView {
  position: fixed; inset: 0; z-index: 80; background: var(--bg); overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: calc(14px + env(safe-area-inset-top)) 20px calc(28px + env(safe-area-inset-bottom));
  transition: clip-path .46s cubic-bezier(.3,.8,.2,1);
}
#streakView .sv-back {
  background: transparent; border: 0;
  position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; width: 44px; height: 44px;
  display: grid; place-items: center; border-radius: 999px; color: var(--ink); z-index: 2;
}
#streakView .sv-back svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
#streakView .sv-in { opacity: 0; transform: translateY(14px) scale(.96); transition: opacity .35s ease .12s, transform .45s cubic-bezier(.2,.8,.3,1) .12s; width: 100%; max-width: 440px; margin: auto 0; text-align: center; }
#streakView.open .sv-in { opacity: 1; transform: none; }
.sv-glow { position: relative; width: min(62vw, 250px); aspect-ratio: 1; margin: 0 auto 6px; display: grid; place-items: center; }
.sv-glow::before {
  content: ""; position: absolute; inset: -16%; border-radius: 50%;
  background: radial-gradient(circle, color-mix(in srgb, currentColor 30%, transparent), transparent 68%);
  animation: svglow 3.2s ease-in-out infinite;
}
.sv-glow .flame { position: relative; width: 100%; height: 100%; animation: svflame 1.9s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes svflame { 0%,100% { transform: scale(1) rotate(-2deg); } 50% { transform: scale(1.06,1.09) rotate(2deg); } }
@keyframes svglow { 0%,100% { opacity: .55; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.06); } }
.sv-glow .flame.flame-idle { animation: none; }
.sv-num { font-size: 52px; font-weight: 800; letter-spacing: -.04em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.sv-lbl { font-size: 17px; font-weight: 700; color: var(--ink-2); margin-top: 2px; }
.sv-days { display: flex; justify-content: center; gap: 10px; margin: 22px 0 6px; }
.sv-day { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.sv-day.today { color: var(--ink); }
.sv-box { width: 44px; height: 44px; border-radius: 10px; border: 2px solid var(--line-strong); display: grid; place-items: center; background: var(--surface); }
.sv-box svg { width: 26px; height: 26px; fill: none; stroke: #fff; stroke-width: 3.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 26; stroke-dashoffset: 26; }
.sv-day.done .sv-box { background: var(--das); border-color: var(--das); }
#streakView.open .sv-day.done .sv-box { animation: svpop .42s cubic-bezier(.3,1.6,.5,1) both; animation-delay: calc(.35s + var(--i) * .09s); }
#streakView.open .sv-day.done .sv-box svg { animation: svcheck .3s ease-out forwards; animation-delay: calc(.5s + var(--i) * .09s); }
@keyframes svpop { 0% { transform: scale(.6); } 100% { transform: scale(1); } }
@keyframes svcheck { to { stroke-dashoffset: 0; } }
.sv-quote { margin: 30px auto 0; padding: 0 6px; max-width: 380px; }
.sv-quote p { margin: 0; font-family: var(--font-serif); font-size: 19px; line-height: 1.45; font-style: italic; }
.sv-quote cite { display: block; margin-top: 12px; font-style: normal; font-size: 12.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
.sv-quote::before { content: ""; display: block; width: 36px; height: 3px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 16px; }
.sv-quote cite:empty { display: none; }
.sv-msg { font-size: 13.5px; color: var(--ink-3); margin-top: 8px; }
@media (prefers-reduced-motion: reduce) {
  #streakView, #streakView .sv-in { transition: none; }
  .sv-glow::before, .sv-glow .flame { animation: none; }
}

.sv-glow.flame-idle { color: #A39B8E; }
.sv-glow.flame-idle::before { display: none; }

/* ---------- progressi ---------- */
.section-h { font-size: 13px; font-weight: 700; color: var(--ink-2); margin: 26px 0 10px; }
.bars { display: flex; flex-direction: column; gap: 9px; }
.barrow {
  display: grid; grid-template-columns: 1fr auto; gap: 3px 10px;
  font-size: 13.5px; width: 100%;
  background: none; border: 0; padding: 0; margin: 0;
  color: inherit; font-family: inherit; text-align: left; cursor: pointer;
}
.barrow .track { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: flex; }
.barrow .track i { display: block; height: 100%; }
.barrow .track .known { background: var(--das); }
.barrow .track .learning { background: var(--flag); }
.barrow .num { color: var(--ink-3); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
.rowlink {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: var(--tap); padding: 10px 13px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  font-size: 14px; font-weight: 600; text-align: left; margin-bottom: 7px;
}
.rowlink small { font-weight: 500; color: var(--ink-3); font-size: 12.5px; }
.rowlink.danger { color: var(--err); }


/* ---------- area impostazioni (delimitata ma discreta) ---------- */
.settingsbox {
  margin-top: 26px;
  border: 1px solid var(--line); border-radius: 14px;
  background: var(--surface-2);
}
.settingsbox > summary {
  list-style: none; cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  min-height: var(--tap); padding: 10px 14px;
  font-size: 13px; font-weight: 700; color: var(--ink-2);
  -webkit-tap-highlight-color: transparent;
}
.settingsbox > summary::-webkit-details-marker { display: none; }
.settingsbox > summary small { font-weight: 500; color: var(--ink-3); font-size: 12px; margin-left: auto; }
.settingsbox > summary::after {

// inserimento automatico giornaliero nel ripasso
function autoAddNewWords() {
  var a = store.prefs.autoNew;
  if (!a || !a.on) return 0;
  var t = today();
  if (a.lastDay === t) return 0;
  if (!db.official.length && !store.custom.length) return 0;   // lessico non ancora caricato
  var learning = allItems().filter(function (i) { var s = store.srs[i.id]; return s && (s.box || 0) < KNOWN_BOX; }).length;
  var due = dueItems().length;
  if (a.lim1On && !(learning < a.lim1)) return 0;
  if (a.lim2On && !(due < a.lim2)) return 0;
  var pick = pickNewWords(a.count, a.preferStarted);
  pick.forEach(function (it) {
    if (store.srs[it.id]) return;                                // mai duplicati né parole già incontrate
    store.srs[it.id] = { box: 0, due: t, right: 0, wrong: 0, auto: t };
    recordChange(undefined, 0);
  });
  a.lastDay = t;
  save("srs"); save("prefs");
  if (pick.length) {
    toast(plural(pick.length, "parola nuova aggiunta", "parole nuove aggiunte") + " al ripasso di oggi.");
    if (!rv && !sheetEl && !el("streakView")) render();
  }
  return pick.length;
}

function idbKV(mode, fn) {

    });
  });
}

var bkRunning = false;

function lastScheduled(now) {
  var ab = store.prefs.autoBackup, hm = (ab.time || "20:00").split(":");
  var d = new Date(now);
  d.setHours(+hm[0] || 0, +hm[1] || 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() - ab.dow + 7) % 7));
  if (d.getTime() > now) d.setDate(d.getDate() - 7);

}
// Il browser non può far partire nulla ad app chiusa: il backup scatta alla prima apertura
// (o appena l'app torna in primo piano) dopo il giorno e l'ora scelti.
function backupCheck(force) {
  var ab = store.prefs.autoBackup;
  if (!ab || !ab.on || bkRunning) return Promise.resolve(false);
  var now = Date.now();
  if (!force && bkMeta.lastAt >= lastScheduled(now)) return Promise.resolve(false);
  // dati non ancora pronti (lessico in caricamento): riprovo più tardi
  if (!db.official.length && !store.custom.length && !Object.keys(store.srs).length) return Promise.resolve(false);
  bkRunning = true;
  var payload = buildBackup();
  return idbPut("autobackup", payload).then(function () { bkMeta.internal = true; }, function () { bkMeta.internal = false; })
    .then(function () { return writeToFolder(payload, false); })
    .then(function (savedToFolder) {
      bkMeta.lastAt = Date.now();
      bkMeta.filePending = !savedToFolder;
      if (savedToFolder) bkMeta.fileAt = bkMeta.lastAt;
      saveBkMeta();
      bkRunning = false;

// scrive nella cartella scelta, se il browser la ricorda e il permesso è ancora valido
function writeToFolder(payload, userGesture) {
  if (!("showDirectoryPicker" in window)) return Promise.resolve(false);
  return idbGet("bkdir").then(function (h) {
    if (!h) return false;
    var perm = userGesture ? (h.requestPermission ? h.requestPermission({ mode: "readwrite" }) : "denied") :
      (h.queryPermission ? h.queryPermission({ mode: "readwrite" }) : "denied");
    return Promise.resolve(perm).then(function (p) {
      if (p !== "granted") return false;
      return h.getFileHandle(BK_FILE, { create: true }).then(function (fh) { return fh.createWritable(); })
        .then(function (w) { return w.write(JSON.stringify(payload)).then(function () { return w.close(); }); })
        .then(function () { return true; });
    });
  }).catch(function () { return false; });
}

      var o = out[k] = Object.assign({}, out[k] || {});
      Object.keys(b[k]).forEach(function (f) { o[f] = Math.max(o[f] || 0, b[k][f] || 0); });

  }

  }

    }
    if (d.deletedIds) {

  return '<div class="setrow' + (dim ? " dim" : "") + '"><div class="txt"><b>' + title + "</b>" + (hint ? "<small>" + hint + "</small>" : "") + "</div>" +
    '<button class="switch ' + (on ? "on" : "") + '" role="switch" aria-checked="' + !!on + '" aria-label="' + esc(title) + '" data-act="' + act + '" data-v="' + esc(v) + '"></button></div>';
}
// rotella: scorre a scatti, il numero al centro è quello scelto
function wheelRow(title, hint, path, min, max, dim) {
  var val = getPath(store.prefs, path), items = "";
  for (var n = min; n <= max; n++) items += '<div class="wheel-i' + (n === val ? " sel" : "") + '" data-n="' + n + '">' + n + "</div>";
  return '<div class="setrow' + (dim ? " dim" : "") + '"><div class="txt"><b>' + title + "</b>" + (hint ? "<small>" + hint + "</small>" : "") + "</div>" +
    '<div class="wheelbox"><div class="wheel" tabindex="0" role="spinbutton" aria-label="' + esc(title) + '" aria-valuemin="' + min + '" aria-valuemax="' + max +
    '" aria-valuenow="' + val + '" data-path="' + path + '" data-min="' + min + '" data-max="' + max + '"><div class="wheel-pad"></div>' + items + '<div class="wheel-pad"></div></div></div></div>';
}
function initWheels(root) {
  Array.prototype.forEach.call(root.querySelectorAll(".wheel"), function (w) {
    var min = +w.dataset.min, max = +w.dataset.max, path = w.dataset.path, cur = getPath(store.prefs, path), timer = null;
    w.scrollTop = (cur - min) * 28;
    function idxVal() { return Math.max(min, Math.min(max, Math.round(w.scrollTop / 28) + min)); }
    function mark(v) {
      Array.prototype.forEach.call(w.querySelectorAll(".wheel-i"), function (it) { it.classList.toggle("sel", +it.dataset.n === v); });
      w.setAttribute("aria-valuenow", v);
    }
    w.addEventListener("scroll", function () {
      var v = idxVal();
      if (v !== cur) { cur = v; mark(v); }
      clearTimeout(timer);
      timer = setTimeout(function () { if (getPath(store.prefs, path) !== cur) { setPath(store.prefs, path, cur); save("prefs"); } }, 160);
    }, { passive: true });
    w.addEventListener("click", function (e) {
      var it = e.target.closest(".wheel-i");
      if (it) w.scrollTo({ top: (+it.dataset.n - min) * 28, behavior: "smooth" });
    });
    w.addEventListener("keydown", function (e) {
      var d = e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0;
      if (!d) return;
      e.preventDefault(); e.stopPropagation();
      w.scrollTo({ top: (Math.max(min, Math.min(max, cur + d)) - min) * 28, behavior: "smooth" });
    });
  });
}

function balanceHtml() {
  var s = histSum(7), t = today();

  var kind = net > 0 ? "up" : net < 0 ? "down" : "flat";
  var rows = [
    ["Nuove parole", "da «mai viste» a «in corso»", s.n, SVG.plus, 1],
    ["Avanzate", "salite di scatola", s.u, SVG.up, 1],
    ["Diventate sicure", "hanno raggiunto la conoscenza acquisita", s.k, SVG.check, 1],
    ["Retrocesse", "tornate a un livello precedente", s.d, SVG.down, -1],
    ["Uscite dalle sicure", "non più «sicure»", s.l, SVG.minus, -1]
  ];
  var h = '<div class="bal"><div class="bal-head"><div class="bal-net ' + kind + '">' + tickHtml(kind, kind === "up" ? SVG.up : kind === "down" ? SVG.down : SVG.minus) +
    (net > 0 ? "+" : net < 0 ? "−" : "") + Math.abs(net) + "</div><small>Bilancio degli ultimi 7 giorni.<br>Conta i cambi di stato avvenuti, non le differenze.</small></div>";
  h += '<div class="bal-scroll" tabindex="0" aria-label="Dettaglio del bilancio, scorrevole">';
  rows.forEach(function (r) {
    var k = r[2] === 0 ? "flat" : (r[4] > 0 ? "up" : "down");
    h += '<div class="bal-row">' + tickHtml(k, r[3]) + '<div class="lbl">' + r[0] + "<small>" + r[1] + '</small></div><b class="' + k + '">' +
      (r[2] === 0 ? "0" : (r[4] > 0 ? "+" : "−") + r[2]) + "</b></div>";
  });
  h += '<div class="bal-sub">Giorno per giorno</div>';
  var mx = 1, days = [];
  for (var i = 0; i < 7; i++) {
    var d = addDays(t, -i), x = (store.hist.days || {})[d] || { n: 0, u: 0, k: 0, d: 0, l: 0 };
    var v = (x.n || 0) + (x.u || 0) + (x.k || 0) - (x.d || 0) - (x.l || 0);
    days.push([d, v]); mx = Math.max(mx, Math.abs(v));
  }
  days.forEach(function (x, i) {
    var p = x[0].split("-"), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var label = i === 0 ? "Oggi" : i === 1 ? "Ieri" : ["dom", "lun", "mar", "mer", "gio", "ven", "sab"][dt.getDay()] + " " + dt.getDate();
    var k = x[1] > 0 ? "up" : x[1] < 0 ? "down" : "flat", w = Math.round(Math.abs(x[1]) / mx * 50);
    h += '<div class="bal-day"><span class="d">' + label + '</span><span class="bar">' + (x[1] ? '<i class="' + k + '" style="width:' + w + '%"></i>' : "") +
      '</span><b class="' + k + '">' + (x[1] > 0 ? "▲ +" : x[1] < 0 ? "▼ −" : "– ") + Math.abs(x[1]) + "</b></div>";
  });
  if (store.hist.since && store.hist.since > addDays(t, -6)) {
    h += '<div class="bal-row"><div class="lbl"><small>Il registro dei cambi è attivo dal ' + esc(store.hist.since.split("-").reverse().join("/")) + ": i giorni precedenti non sono disponibili.</small></div></div>";
  }
  return h + "</div></div>";
}

/* ---------------- dati derivati ---------------- */

function allItems() {
  var out = [];
  for (var i = 0; i < db.official.length; i++) {
    var it = db.official[i];
    if (store.deleted.indexOf(it.id) !== -1) continue;
    out.push(store.overrides[it.id] ? Object.assign({}, it, store.overrides[it.id]) : it);
  }
  return out.concat(store.custom);
}
function allTopics() {
  var t = db.officialTopics.slice();
  store.topics.forEach(function (x) { if (t.indexOf(x) === -1) t.push(x); });
  return t;
}
function srsOf(id) { return store.srs[id] || { box: 0, due: null, right: 0, wrong: 0 }; }
function isDue(id) {
  var s = store.srs[id];
  if (!s || !s.due) return false;
  return s.due <= today();
}
function isNew(id) { return !store.srs[id]; }
function dueItems() {
  return allItems().filter(function (i) { return isDue(i.id); });
}
function matches(it) {
  if (state.onlyFlag && !store.flags[it.id]) return false;
  if (state.topics.length && !(it.topics || []).some(function (t) { return state.topics.indexOf(t) !== -1; })) return false;
  if (state.types.length && state.types.indexOf(it.type) === -1) return false;
  if (!state.q) return true;
  var q = fold(state.q);
  if (!q) return true;
  var hay = fold([it.german, it.italian, it.articolo, it.plurale, it.femminile, it.reggenza,
    it.note, it.esempio, it.esempioTraduzione, (it.topics || []).join(" ")].filter(Boolean).join(" "));
  return hay.indexOf(q) !== -1;
}
function filtered() {
  var list = allItems().filter(matches);
  if (state.sort === "alpha") {
    list.sort(function (a, b) { return fold(a.german).localeCompare(fold(b.german), "de"); });
  } else if (state.sort === "type") {
    list.sort(function (a, b) {
      var d = TYPE_KEYS.indexOf(a.type) - TYPE_KEYS.indexOf(b.type);
      return d !== 0 ? d : fold(a.german).localeCompare(fold(b.german), "de");
    });
  } else if (state.sort === "new") {
    list.sort(function (a, b) {
      var ab = srsOf(a.id).box, bb = srsOf(b.id).box;
      return ab !== bb ? ab - bb : fold(a.german).localeCompare(fold(b.german), "de");
    });
  }
  return list;
}

/* ---------------- ripetizione a intervalli ---------------- */

function gradeItem(id, grade) {
  var s = srsOf(id);
  var prevBox = store.srs[id] ? (store.srs[id].box || 0) : undefined;
  var box = s.box || 0;
  if (grade === 0) { box = 0; s.wrong = (s.wrong || 0) + 1; }
  else if (grade === 1) { box = Math.max(1, box); s.right = (s.right || 0) + 1; }
  else { box = Math.min(INTERVALS.length - 1, box + 1); s.right = (s.right || 0) + 1; }
  s.box = box;
  s.due = addDays(today(), INTERVALS[box]);
  s.last = today();
  store.srs[id] = s;
  save("srs");
  recordChange(prevBox, box);
  countReview();
}
function countReview() {
  markStreakActivity();
  store.stats.total = (store.stats.total || 0) + 1;
  save("stats");
}
// registra la giornata come "attiva" solo quando si fa qualcosa di vero:
// un ripasso, un esercizio o l'aggiunta di una parola. Aprire l'app non basta.
function markStreakActivity(skipCount) {
  var t = today(), st = store.stats;
  st.byDay = st.byDay || {};
  if (!skipCount) st.byDay[t] = (st.byDay[t] || 0) + 1;
  if (st.lastDay !== t) {
    st.streak = st.lastDay && daysBetween(st.lastDay, t) === 1 ? (st.streak || 0) + 1 : 1;
    st.lastDay = t;
  }
  // tengo solo gli ultimi 120 giorni, per non gonfiare localStorage
  var keys = Object.keys(st.byDay).sort();
  while (keys.length > 120) { delete st.byDay[keys.shift()]; }
  save("stats");
}

/* ---------------- pronuncia ---------------- */

var voiceDE = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  var vs = speechSynthesis.getVoices() || [];
  voiceDE = vs.filter(function (v) { return /^de/i.test(v.lang); })[0] || null;
}
if ("speechSynthesis" in window) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}
function speak(text) {
  if (!store.prefs.audio || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = "de-DE";
    u.rate = 0.92;
    if (voiceDE) u.voice = voiceDE;
    speechSynthesis.speak(u);
  } catch (e) { /* niente voce disponibile: pazienza */ }
}

function applyTheme() {
  var p = store.prefs.theme;
  var resolved = p;
  if (!THEMES.some(function (t) { return t.id === p; })) resolved = "auto";
  if (resolved === "auto") resolved = darkQuery && darkQuery.matches ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", resolved);
  // la barra di sistema del telefono deve seguire lo sfondo scelto
  var bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
  Array.prototype.forEach.call(document.querySelectorAll('meta[name="theme-color"]'), function (m) { m.remove(); });
  if (bg) {
    var m = document.createElement("meta");
    m.name = "theme-color";
    m.content = bg;
    document.head.appendChild(m);
  }
}
if (darkQuery) {
  // addEventListener sui MediaQueryList manca su iOS < 14
  if (darkQuery.addEventListener) darkQuery.addEventListener("change", applyTheme);
  else if (darkQuery.addListener) darkQuery.addListener(applyTheme);
}

/* =================================================================
   RENDERING
   ================================================================= */

var TABS = [
  { id: "lessico", label: "Lessico", icon: icons.book },
  { id: "ripasso", label: "Ripasso", icon: icons.cards },
  { id: "quiz", label: "Esercizi", icon: icons.quiz },
  { id: "progressi", label: "Progressi", icon: icons.chart }
];

function renderTabs() {
  var due = dueItems().length;
  el("tabbar").innerHTML = TABS.map(function (t) {
    var badge = t.id === "ripasso" && due ? '<span class="badge">' + (due > 99 ? "99+" : due) + "</span>" : "";
    return '<button class="tab" role="tab" data-tab="' + t.id + '" aria-selected="' + (state.tab === t.id) + '">' +
      t.icon + badge + "<span>" + t.label + "</span></button>";
  }).join("");
}

function topbar(sub) {
  return '<header class="topbar" id="topbar">' +
    '<div class="brand"><h1>Der Wortschatzkasten</h1><p>' + esc(sub) + "</p></div>" +
    '<div class="topbar-actions">' +
      '<button class="iconbtn" data-act="settings" aria-label="Impostazioni">⋯</button>' +
    "</div></header>" + bkBannerHtml();
}

function render() {
  renderTabs();
  var app = el("app");
  if (state.tab === "lessico") app.innerHTML = viewLessico();
  else if (state.tab === "ripasso") app.innerHTML = viewRipasso();
  else if (state.tab === "quiz") app.innerHTML = viewQuiz();
  else app.innerHTML = viewProgressi();
  afterRender();
  window.scrollTo(0, 0);
}

function afterRender() {
  var s = $("#searchInput");
  if (s) {
    s.value = state.q;
    s.addEventListener("input", function () {
      state.q = this.value;
      renderList();
      var c = $("#clearSearch"); if (c) c.style.visibility = this.value ? "visible" : "hidden";
    });
  }
  var qi = $("#quizInput");
  if (qi) { qi.focus(); }
}

/* ---------------- 1. Lessico ---------------- */

function viewLessico() {
  var total = allItems().length;
  var h = topbar(plural(total, "parola nel tuo Kasten", "parole nel tuo Kasten"));
  h += '<div class="searchrow"><label class="search">' + icons.search +
    '<input id="searchInput" type="search" enterkeyhint="search" placeholder="Cerca in tedesco o in italiano" aria-label="Cerca" />' +
    '<button id="clearSearch" data-act="clearq" aria-label="Cancella ricerca" style="visibility:' + (state.q ? "visible" : "hidden") + '">✕</button>' +
    "</label></div>";

  h += '<div id="filtersWrap">' + filtersHtml() + "</div>";
  h += '<button class="fab" data-act="add">+ Nuova parola</button>';
  return h;
}

function filtersHtml() {
  var counts = {};
  allItems().forEach(function (i) { (i.topics || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
  var flagN = Object.keys(store.flags).filter(function (k) { return store.flags[k]; }).length;

  var h = '<div class="chiprow" id="topicChips" role="group" aria-label="Filtra per argomento">';
  h += '<button class="chip browsechip" data-act="browsetopics" aria-label="Sfoglia tutti gli argomenti">' + icons.list + "</button>";
  h += '<button class="chip flagchip ' + (state.onlyFlag ? "on" : "") + '" data-act="toggleflag">' + icons.flag +
    ' Da studiare <span class="n">' + flagN + "</span></button>";
  h += '<button class="chip ' + (state.topics.length === 0 ? "on" : "") + '" data-act="topic" data-v="*">Tutti gli argomenti</button>';
  if (state.topics.length) h += '<button class="chip clearchip" data-act="cleartopics" aria-label="Deseleziona tutti gli argomenti">✕</button>';
  h += allTopics().map(function (t) {
    return '<button class="chip ' + (state.topics.indexOf(t) !== -1 ? "on" : "") + '" data-act="topic" data-v="' + esc(t) + '">' +
      esc(t) + ' <span class="n">' + (counts[t] || 0) + "</span></button>";
  }).join("");
  h += "</div>";

  h += '<div class="chiprow" id="typeChips" role="group" aria-label="Filtra per categoria grammaticale">';
  h += '<button class="chip browsechip" data-act="browsetypes" aria-label="Sfoglia tutte le categorie">' + icons.list + "</button>";
  h += '<button class="chip ' + (state.types.length === 0 ? "on" : "") + '" data-act="type" data-v="*">Tutte le categorie</button>';
  if (state.types.length) h += '<button class="chip clearchip" data-act="cleartypes" aria-label="Deseleziona tutte le categorie">✕</button>';
  h += TYPE_KEYS.map(function (k) {
    return '<button class="chip ' + (state.types.indexOf(k) !== -1 ? "on" : "") + '" data-act="type" data-v="' + k + '">' + TYPES[k].many + "</button>";
  }).join("");
  h += "</div>";

  h += '<div id="listWrap">' + listHtml() + "</div>";
  return h;
}

function renderList() {
  var w = el("listWrap");
  if (w) w.innerHTML = listHtml();
}

// aggiorna chip e lista senza ricreare la barra superiore: la posizione di scorrimento
// orizzontale dei chiprow resta quella che l'utente aveva scelto.
function renderFilters() {
  var wrap = el("filtersWrap");
  if (!wrap) { render(); return; }
  var tc = $("#topicChips"), yc = $("#typeChips");
  var ts = tc ? tc.scrollLeft : 0, ys = yc ? yc.scrollLeft : 0;
  wrap.innerHTML = filtersHtml();
  var ntc = $("#topicChips"); if (ntc) ntc.scrollLeft = ts;
  var nyc = $("#typeChips"); if (nyc) nyc.scrollLeft = ys;
}

function listHtml() {
  var list = filtered();
  var sorts = [["alpha", "A → Z"], ["type", "Categoria"], ["new", "Da imparare prima"]];
  var h = '<div class="resultline"><span>' + plural(list.length, "risultato", "risultati") + "</span>" +
    '<button class="linkbtn" data-act="cyclesort">Ordine: ' +
    sorts.filter(function (s) { return s[0] === state.sort; })[0][1] + "</button></div>";

  if (!list.length) {
    return h + '<div class="empty"><strong>Nessuna parola con questi filtri</strong>' +
      "<p>Prova a togliere un filtro o a cercare un'altra parola.</p>" +
      '<button class="btn ghost" data-act="resetfilters">Azzera i filtri</button></div>';
  }
  if (state.sort === "type") {
    // ordino per categoria: rendo visibile il riordinamento con intestazioni di gruppo
    var lastType = null, body = "";
    list.forEach(function (it) {
      if (it.type !== lastType) {
        lastType = it.type;
        body += '<div class="group-h">' + esc(TYPES[it.type] ? TYPES[it.type].many : it.type) + "</div>";
      }
      body += entryHtml(it);
    });
    h += '<div class="list">' + body + "</div>";
  } else {
    h += '<div class="list">' + list.map(entryHtml).join("") + "</div>";
  }
  return h;
}

function entryHtml(it) {
  var open = state.openId === it.id;
  var g = genderVar(it);
  var box = srsOf(it.id).box;
  var pct = Math.round((box / (INTERVALS.length - 1)) * 100);
  var art = it.type === "sostantivo" && it.articolo ? '<span class="art">' + it.articolo + "</span> " : "";

  var h = '<div class="entry ' + (open ? "open" : "") + '" style="--g:' + g + '" data-id="' + esc(it.id) + '">';
  h += '<button class="lemma" data-act="open" data-id="' + esc(it.id) + '" aria-expanded="' + open + '">' +
    art + esc(it.german) + "</button>";
  h += '<div class="side">' +
    '<button class="flagbtn ' + (store.flags[it.id] ? "on" : "") + '" data-act="flag" data-id="' + esc(it.id) + '" ' +
    'aria-label="Segna come da studiare" aria-pressed="' + !!store.flags[it.id] + '">' + icons.flag + "</button>" +
    (box > 0 ? '<span class="mastery" title="Quanto la sai"><i style="width:' + pct + '%"></i></span>' : "") +
    "</div>";
  h += '<div class="gloss">' + esc(it.italian) + "</div>";
  h += '<div class="meta"><span class="pill type">' + TYPES[it.type].one + "</span>" +
    (it.topics || []).map(function (t) { return '<span class="pill">' + esc(t) + "</span>"; }).join("") + "</div>";

  if (open) h += detailHtml(it);
  h += "</div>";
  return h;
}

function detailHtml(it) {
  var rows = [];
  if (it.type === "sostantivo") {
    rows.push(["Plurale", it.plurale || "—"]);
    if (it.femminile) rows.push(["Femminile", it.femminile + (it.femminilePlurale ? " (pl. " + it.femminilePlurale + ")" : "")]);
  }
  if (it.type === "verbo") {
    if (it.reggenza) rows.push(["Reggenza", it.reggenza]);
    rows.push(["Präsens", it.praesens || "—"]);
    rows.push(["Präteritum", it.praeteritum || "—"]);
    rows.push(["Perfekt", it.perfekt || "—"]);
  }
  if (it.type === "aggettivo") {
    if (it.reggenza) rows.push(["Uso", it.reggenza]);
    if (it.comparativo) rows.push(["Comparativo", it.comparativo]);
    if (it.superlativo) rows.push(["Superlativo", it.superlativo]);
  }
  if (it.type === "preposizione" && it.caso) rows.push(["Regge", it.caso]);
  if (it.reggenza && ["verbo", "aggettivo"].indexOf(it.type) === -1) rows.push(["Costruzione", it.reggenza]);

  var s = srsOf(it.id);
  var h = '<div class="detail">';
  if (rows.length) h += "<dl>" + rows.map(function (r) {
    return "<dt>" + esc(r[0]) + "</dt><dd>" + esc(r[1]) + "</dd>";
  }).join("") + "</dl>";
  if (it.note) h += '<div class="note">' + esc(it.note) + "</div>";
  if (it.esempio) h += '<div class="example">' + esc(it.esempio) +
    (it.esempioTraduzione ? "<em>" + esc(it.esempioTraduzione) + "</em>" : "") + "</div>";
  if (s.due) h += '<div class="note">Prossimo ripasso: ' + (s.due <= today() ? "oggi" : esc(s.due)) +
    " · risposte esatte " + (s.right || 0) + ", sbagliate " + (s.wrong || 0) + "</div>";

  h += '<div class="detail-actions">';
  h += '<button class="tinybtn" data-act="speak" data-id="' + esc(it.id) + '">' + icons.sound + " Ascolta</button>";
  h += '<button class="tinybtn" data-act="edit" data-id="' + esc(it.id) + '">' + icons.pencil + " Modifica</button>";
  if (state.confirmId === it.id) {
    h += '<button class="tinybtn danger" data-act="reallydelete" data-id="' + esc(it.id) + '">Confermi? Elimina</button>' +
      '<button class="tinybtn" data-act="cancelconfirm">Annulla</button>';
  } else {
    h += '<button class="tinybtn danger" data-act="delete" data-id="' + esc(it.id) + '">' + icons.trash + " Elimina</button>";
  }
  h += "</div></div>";
  return h;
}

/* ---------------- 2. Ripasso ---------------- */

function viewRipasso() {
  var due = dueItems();
  var nuove = allItems().filter(function (i) { return isNew(i.id); });
  var h = topbar("Ripasso a intervalli crescenti");

  if (rv) return h + reviewSessionHtml();

  h += '<div class="review-head">';
  h += '<div class="dueline"><span class="big">' + due.length + "</span>" +
    '<span class="lbl">' + (due.length ? "parole da ripassare oggi.<br>Il momento giusto è adesso." :
      "parole in scadenza oggi.<br>Sei in pari: puoi allenarti lo stesso.") + "</span></div>";

  if (due.length) {
    h += '<button class="btn block" data-act="startdue">Ripassa le ' + due.length + " di oggi</button>";
  }
  h += '<div class="statgrid">' +
    '<div class="statbox"><b>' + nuove.length + "</b><span>mai viste</span></div>" +
    '<div class="statbox"><b>' + allItems().filter(function (i) { return srsOf(i.id).box >= KNOWN_BOX; }).length + "</b><span>sicure</span></div>" +
    '<div class="statbox" role="button" tabindex="0" data-act="streak" aria-label="Apri la tua costanza"><b>' + (store.stats.streak || 0) + flameHtml(store.stats.streak) + "</b><span>giorni di fila</span></div>" +
    "</div>";

  h += '<div class="section-h">Allenamento libero</div>';
  h += '<p style="margin:0 0 12px;font-size:14px;color:var(--ink-2)">Parte dalle parole che stai filtrando nel Lessico' +
    (state.topics.length ? " (" + esc(topicsSummary(state.topics)) + ")" : " (tutte)") + ".</p>";
  h += '<div class="pickrow" style="margin-bottom:12px">' +
    dirBtn("de-it", "Tedesco → Italiano") + dirBtn("it-de", "Italiano → Tedesco") + dirBtn("mix", "Alternate") +
    "</div>";
  h += '<button class="btn ghost block" data-act="startfree">Inizia con ' + filtered().length + " parole</button>";
  if (store.prefs.prioUnseen && state.topics.length) {
    var unseenN = filtered().filter(function (i) { return isNew(i.id); }).length;
    h += '<p style="margin:8px 2px 0;font-size:12.5px;color:var(--ink-3)">' + (unseenN ? plural(unseenN, "parola mai vista", "parole mai viste") + " in prima fila." : "Nessuna parola mai vista in questa selezione.") + "</p>";
  }
  if (nuove.length) {
    h += '<button class="btn ghost block" style="margin-top:8px" data-act="startnew">Scopri 10 parole nuove</button>';
  }
  h += "</div>";
  return h;
}
function dirBtn(v, label) {
  return '<button class="pick ' + (store.prefs.dir === v ? "on" : "") + '" data-act="setdir" data-v="' + v + '">' + label + "</button>";
}

function startSession(list, label, opts) {
  if (!list.length) { toast("Non ci sono parole con questi filtri."); return; }
  rv = {
    queue: (opts && opts.unseenFirst ? unseenFirst(list) : shuffle(list)).map(function (i) { return i.id; }),
    total: list.length, done: 0, flipped: false, label: label,
    right: 0, again: 0, startBox: {}
  };
  list.forEach(function (i) { rv.startBox[i.id] = srsOf(i.id).box; });
  render();
}

function currentCard() {
  if (!rv || !rv.queue.length) return null;
  var id = rv.queue[0];
  var found = allItems().filter(function (i) { return i.id === id; })[0];
  return found || null;
}

function reviewSessionHtml() {
  var it = currentCard();
  if (!it) return sessionDoneHtml();

  var germanFirst = store.prefs.dir === "de-it" ||
    (store.prefs.dir === "mix" && (rv.done % 2 === 0));
  var g = genderVar(it);
  var pct = Math.round((rv.done / Math.max(1, rv.total)) * 100);

  var h = '<div class="progressbar" aria-hidden="true"><i style="width:' + pct + '%"></i></div>';
  h += '<div class="resultline"><span>' + esc(rv.label) + " · " + Math.min(rv.done + 1, rv.total) + " di " + rv.total + "</span>" +
    '<button class="linkbtn" data-act="endsession">Chiudi sessione</button></div>';

  h += '<div class="cardtools">' +
    '<button class="iconbtn" data-act="flipdir">⇄ ' + (germanFirst ? "DE → IT" : "IT → DE") + "</button>" +
    '<button class="iconbtn ' + (store.flags[it.id] ? "on" : "") + '" data-act="flag" data-id="' + esc(it.id) + '">' +
      icons.flag + (store.flags[it.id] ? " Segnata" : " Segna") + "</button>" +
    '<button class="iconbtn" data-act="speak" data-id="' + esc(it.id) + '">' + icons.sound + "</button>" +
    "</div>";

  var front, back;
  var forms = "";
  if (it.type === "verbo" && (it.praesens || it.perfekt)) {
    forms = '<div class="forms">' + esc([it.praesens, it.praeteritum, it.perfekt].filter(Boolean).join(" · ")) + "</div>";
  } else if (it.type === "sostantivo" && it.plurale) {
    forms = '<div class="forms">Plurale: ' + esc(it.plurale) + "</div>";
  }
  var germanFace = '<div class="lemma-xl">' +
    (it.type === "sostantivo" && it.articolo ? '<span class="art">' + it.articolo + "</span> " : "") +
    esc(it.german) + "</div>" +
    (it.reggenza ? '<div class="sub">' + esc(it.reggenza) + "</div>" : "");
  var italianFace = '<div class="gloss-xl">' + esc(it.italian) + "</div>";
  var extra = forms + (it.note ? '<div class="sub">' + esc(it.note) + "</div>" : "") +
    (it.esempio ? '<div class="ex">' + esc(it.esempio) + (it.esempioTraduzione ? "<br><span style=\"font-size:13px\">" + esc(it.esempioTraduzione) + "</span>" : "") + "</div>" : "");

  if (germanFirst) { front = germanFace; back = italianFace + extra; }
  else { front = italianFace; back = germanFace + extra; }

  h += '<div class="cardstage" style="--g:' + g + '">' +
    '<div class="flip ' + (rv.flipped ? "flipped" : "") + '" id="flipCard" data-id="' + esc(it.id) + '" data-act="flip" role="button" tabindex="0" aria-label="Gira la scheda">' +
      '<div class="face front">' + front + '<div class="sub" style="margin-top:6px">' + TYPES[it.type].one + "</div></div>" +
      '<div class="face back">' + back + "</div>" +
    "</div></div>";

  if (!rv.flipped) {
    h += '<div class="hint">Tocca la scheda per scoprire la risposta · spazio o frecce da tastiera</div>';
  } else {
    var s = srsOf(it.id);
    h += '<div class="grades">' +
      '<button class="grade g0" data-act="grade" data-v="0">Da rivedere<small>torna oggi</small></button>' +
      '<button class="grade g1" data-act="grade" data-v="1">Incerta<small>fra ' + INTERVALS[Math.max(1, s.box)] + "g</small></button>" +
      '<button class="grade g2" data-act="grade" data-v="2">La so<small>fra ' + INTERVALS[Math.min(INTERVALS.length - 1, (s.box || 0) + 1)] + "g</small></button>" +
      "</div>";
    h += '<div class="hint">Tasti 1 · 2 · 3</div>';
  }
  return h;
}

function sessionDoneHtml() {
  var promossi = Object.keys(rv.startBox).filter(function (id) { return srsOf(id).box > rv.startBox[id]; }).length;
  var h = '<div class="sessiondone">' +
    '<div class="big">' + rv.total + "</div>" +
    "<p style=\"margin:4px 0 0;font-size:15px\">schede riviste. " +
    (promossi ? promossi + " sono salite di livello." : "Nessuna promossa: rivedile presto.") + "</p>" +
    '<div class="statgrid">' +
      '<div class="statbox"><b>' + rv.right + "</b><span>sapute</span></div>" +
      '<div class="statbox"><b>' + rv.again + "</b><span>da rivedere</span></div>" +
      '<div class="statbox" role="button" tabindex="0" data-act="streak" aria-label="Apri la tua costanza"><b>' + (store.stats.streak || 0) + flameHtml(store.stats.streak) + "</b><span>giorni di fila</span></div>" +
    "</div>" +
    '<button class="btn block" data-act="endsession">Torna al ripasso</button>' +
    "</div>";
  return h;
}

/* ---------------- 3. Esercizi ---------------- */

var QUIZ_MODES = [
  { id: "traduzione", label: "Che significa?" },
  { id: "inverso", label: "Come si dice?" },
  { id: "articolo", label: "der / die / das" },
  { id: "scrittura", label: "Scrivila tu" }
];

function viewQuiz() {
  if (!qz) { qz = newQuiz(QUIZ_MODES[0].id, null); newQuestion(); }
  var h = topbar("Esercizi sul lessico");
  h += '<div id="quizWrap">' + quizInnerHtml() + "</div>";
  return h;
}

function quizInnerHtml() {
  var h = '<div class="chiprow" style="margin-top:12px" role="group" aria-label="Tipo di esercizio">' +
    QUIZ_MODES.map(function (m) {
      return '<button class="chip ' + (qz.mode === m.id ? "on" : "") + '" data-act="quizmode" data-v="' + m.id + '">' + m.label + "</button>";
    }).join("") + "</div>";

  var counts = {};
  allItems().forEach(function (i) { (i.topics || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
  var flagN = Object.keys(store.flags).filter(function (k) { return store.flags[k]; }).length;

  h += '<div class="chiprow" id="quizTopicChips" role="group" aria-label="Argomento su cui esercitarsi">';
  h += '<button class="chip browsechip" data-act="browseqtopics" aria-label="Sfoglia tutti gli argomenti">' + icons.list + "</button>";
  h += '<button class="chip ' + (qz.topics.length === 0 && !qz.onlyFlag ? "on" : "") + '" data-act="quiztopic" data-v="*">Tutto il lessico <span class="n">' + allItems().length + "</span></button>";
  if (qz.topics.length) h += '<button class="chip clearchip" data-act="clearqtopics" aria-label="Deseleziona tutti gli argomenti">✕</button>';
  if (flagN) {
    h += '<button class="chip flagchip ' + (qz.onlyFlag ? "on" : "") + '" data-act="quizflag">' + icons.flag +
      ' Da studiare <span class="n">' + flagN + "</span></button>";
  }
  h += allTopics().map(function (t) {
    if (!counts[t]) return "";
    return '<button class="chip ' + (qz.topics.indexOf(t) !== -1 ? "on" : "") + '" data-act="quiztopic" data-v="' + esc(t) + '">' +
      esc(t) + ' <span class="n">' + counts[t] + "</span></button>";
  }).join("");
  h += "</div>";

  var poolN = poolFor(qz.mode).length;
  h += '<div class="resultline"><span>' + plural(poolN, "parola in gioco", "parole in gioco") +
    (qz.topics.length ? " · " + esc(topicsSummary(qz.topics)) : "") + "</span>" +
    '<button class="linkbtn" data-act="resetquiz">Ricomincia</button></div>';

  if (!qz.q) {
    return h + '<div class="empty"><strong>Servono più parole</strong><p>' + esc(qz.reason || "Scegli un argomento con più parole.") + "</p></div>";
  }
  h += quizCardHtml();
  return h;
}

// aggiorna i chip e la scheda dell'esercizio senza ricreare la barra:
// così lo scorrimento orizzontale scelto dall'utente resta dov'era.
function renderQuizFilters() {
  var wrap = el("quizWrap");
  if (!wrap) { render(); return; }
  var tc = $("#quizTopicChips");
  var ts = tc ? tc.scrollLeft : 0;
  wrap.innerHTML = quizInnerHtml();
  var ntc = $("#quizTopicChips"); if (ntc) ntc.scrollLeft = ts;
  var qi = $("#quizInput"); if (qi) qi.focus();
}

function newQuiz(mode, prev) {
  return {
    mode: mode,
    topics: prev ? prev.topics.slice() : [],
    onlyFlag: prev ? prev.onlyFlag : false,
    right: 0, total: 0, streak: 0,
    picked: null, typed: "", q: null, recent: []
  };
}

function poolFor(mode) {
  // Gli esercizi hanno filtri propri: la ricerca scritta nel Lessico non c'entra.
  var base = allItems();
  if (qz.topics.length) base = base.filter(function (i) { return (i.topics || []).some(function (t) { return qz.topics.indexOf(t) !== -1; }); });
  if (qz.onlyFlag) base = base.filter(function (i) { return store.flags[i.id]; });
  if (mode === "articolo") base = base.filter(function (i) { return i.type === "sostantivo" && i.articolo; });
  return base;
}

// Pesco senza ripetere: tengo memoria delle ultime uscite e do la precedenza
// alle parole che so meno.
function drawFrom(pool) {
  var recentMax = Math.min(pool.length - 1, 15);
  var fresh = pool.filter(function (i) { return qz.recent.indexOf(i.id) === -1; });
  if (fresh.length < 1) { qz.recent = qz.recent.slice(-Math.max(0, recentMax - 5)); fresh = pool; }
  var bag = [];
  fresh.forEach(function (i) {
    var s = srsOf(i.id);
    var weight = 1 + Math.max(0, 3 - (s.box || 0)) + Math.min(3, s.wrong || 0);
    for (var n = 0; n < weight; n++) bag.push(i);
  });
  var pick = bag[Math.floor(Math.random() * bag.length)];
  qz.recent.push(pick.id);
  if (qz.recent.length > recentMax) qz.recent.shift();
  return pick;
}

function newQuestion() {
  var mode = qz.mode;
  var pool = poolFor(mode);
  if (mode === "articolo" && pool.length < 1) { qz.q = null; qz.reason = "In questo argomento non ci sono sostantivi con articolo."; return; }
  if (mode !== "articolo" && pool.length < 4) { qz.q = null; qz.reason = "Servono almeno 4 parole: scegli un argomento più ampio."; return; }

  var correct = drawFrom(pool);
  qz.picked = null;
  qz.typed = "";
  qz.reason = null;

  if (mode === "articolo") {
    qz.q = { item: correct, options: ["der", "die", "das"].map(function (a) { return { id: a, text: a }; }), answer: correct.articolo };
    return;
  }
  if (mode === "scrittura") {
    qz.q = { item: correct, answer: correct.german };
    return;
  }
  // distrattori credibili: stessa categoria, meglio se stesso argomento
  var others = allItems().filter(function (i) { return i.id !== correct.id && i.italian !== correct.italian && i.german !== correct.german; });
  var sameTopic = others.filter(function (i) {
    return i.type === correct.type && (i.topics || []).some(function (t) { return (correct.topics || []).indexOf(t) !== -1; });
  });
  var sameType = others.filter(function (i) { return i.type === correct.type; });
  var picks = sample(sameTopic, 3);
  if (picks.length < 3) picks = picks.concat(sample(sameType.filter(function (i) { return picks.indexOf(i) === -1; }), 3 - picks.length));
  if (picks.length < 3) picks = picks.concat(sample(others.filter(function (i) { return picks.indexOf(i) === -1; }), 3 - picks.length));

  qz.q = {
    item: correct,
    options: shuffle([correct].concat(picks)).map(function (i) {
      return { id: i.id, text: mode === "traduzione" ? i.italian : headword(i) };
    }),
    answer: correct.id
  };
}

function quizCardHtml() {

  } else if (mode === "articolo") {

    h += '<div class="qword">' + esc(it.german) + '<div class="qprompt" style="margin-top:6px">' + esc(it.italian) + "</div></div>";

    h += '<input id="quizInput" class="qinput ' + cls + '" autocomplete="off" autocapitalize="off" spellcheck="false" ' +
      'enterkeyhint="go" value="' + esc(qz.typed) + '" ' + (qz.picked ? "readonly" : "") + ' aria-label="La tua risposta" />';
    if (!qz.picked) {
      h += '<div class="umlauts">' + ["ä", "ö", "ü", "ß", "Ä", "Ö", "Ü"].map(function (c) {
        return '<button data-act="uml" data-v="' + c + '">' + c + "</button>";
      }).join("") + "</div>";
      h += '<button class="btn block" style="margin-top:12px" data-act="checkwrite">Controlla</button>';
    }
  } else {
    h += '<div class="qopts">' + q.options.map(function (o, n) {
      var c = "qopt" + (mode === "articolo" ? " art" : "");
      if (qz.picked) {
        if (o.id === q.answer) c += " right";
        else if (o.id === qz.picked) c += " wrongpick";
      }
      return '<button class="' + c + '" data-act="answer" data-v="' + esc(o.id) + '">' +
        (mode === "articolo" ? "" : '<span class="k">' + (n + 1) + "</span>") + esc(o.text) + "</button>";
    }).join("") + "</div>";
  }

  if (qz.picked) {
    var ok = mode === "scrittura" ? (qz.picked === "ok" || qz.picked === "quasi") : qz.picked === q.answer;
    h += '<div class="verdict ' + (ok ? "ok" : "no") + '">';
    if (qz.picked === "quasi") h += "<b>Quasi: attenzione all'Umlaut</b>";
    else h += "<b>" + (ok ? "Esatta" : "Non ci siamo") + "</b>";
    h += esc(headword(it)) + " — " + esc(it.italian);
    if (it.note) h += '<div class="qprompt" style="margin-top:6px">' + esc(it.note) + "</div>";
    h += "</div>";
    h += '<button class="btn block" style="margin-top:14px" data-act="nextq">Prossima parola</button>';
  }
  h += "</div>";

  h += '<div class="scorerow"><span>' + qz.right + " esatte su " + qz.total + "</span>" +
    (qz.streak > 1 ? '<span class="streak">' + qz.streak + " di fila</span>" : "<span></span>") +
    "</div>";
  return h;
}

function answerQuiz(val) {
  if (qz.picked) return;
  var q = qz.q, ok;
  if (qz.mode === "scrittura") {
    var given = fold(qz.typed).replace(/^(der|die|das)\s+/, "");
    var want = fold(q.answer).replace(/^(der|die|das)\s+/, "");
    var exact = qz.typed.trim().toLowerCase().replace(/^(der|die|das)\s+/, "") === String(q.answer).toLowerCase();
    if (exact) qz.picked = "ok";
    else if (given && given === want) qz.picked = "quasi";
    else qz.picked = "no";
    ok = qz.picked !== "no";
  } else {
    qz.picked = val;
    ok = val === q.answer;
  }
  qz.total++;
  if (ok) { qz.right++; qz.streak++; }
  else {
    qz.streak = 0;
    store.flags[q.item.id] = true; save("flags");
    var s = srsOf(q.item.id);
    var prevBox = store.srs[q.item.id] ? (store.srs[q.item.id].box || 0) : undefined;
    s.box = 0; s.due = today(); s.wrong = (s.wrong || 0) + 1;
    store.srs[q.item.id] = s; save("srs");
    recordChange(prevBox, 0);
  }
  markStreakActivity();
  renderQuizFilters();
}

var sheetEl = null;
function openSheet(html, keepOpen) {
  // se la finestra è già aperta e basta aggiornarla (es. selezione di un argomento),
  // sostituisco solo il contenuto: così lo scroll resta dov'è e non riparte l'animazione
  if (keepOpen && sheetEl) {
    var box = sheetEl.querySelector(".sheet");
    var top = box.scrollTop;
    box.innerHTML = html;
    box.scrollTop = top;
    return;
  }
  closeSheet();
  sheetEl = document.createElement("div");
  sheetEl.className = "sheet-bg";
  sheetEl.innerHTML = '<div class="sheet" role="dialog" aria-modal="true">' + html + "</div>";
  sheetEl.addEventListener("click", function (e) { if (e.target === sheetEl) closeSheet(); });
  document.body.appendChild(sheetEl);
  document.body.style.overflow = "hidden";
}
function closeSheet() {
  if (sheetEl) { sheetEl.remove(); sheetEl = null; document.body.style.overflow = ""; }
}

// sheet con tutti gli argomenti/categorie in un'unica vista, per selezionarne
// più di uno senza dover scorrere le barre orizzontali.
function openPickSheet(kind) {
  var isType = kind === "type", isQ = kind === "qtopic";
  var counts = {};
  if (!isType) allItems().forEach(function (i) { (i.topics || []).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; }); });
  var items = isType ? TYPE_KEYS.map(function (k) { return { v: k, label: TYPES[k].many, n: null }; })
    : allTopics().filter(function (t) { return !isQ || counts[t]; }).map(function (t) { return { v: t, label: t, n: counts[t] || 0 }; });
  var sel = isType ? state.types : (isQ ? qz.topics : state.topics);
  var act = isType ? "type" : (isQ ? "quiztopic" : "topic");
  var title = isType ? "Categorie grammaticali" : (isQ ? "Argomenti per l'esercizio" : "Argomenti");
  var h = '<div class="sheet-h"><h2>' + title + '</h2><button class="iconbtn" data-act="closesheet" aria-label="Chiudi">✕</button></div>';
  h += '<div class="pickrow">' + items.map(function (it) {
    return '<button class="pick ' + (sel.indexOf(it.v) !== -1 ? "on" : "") + '" data-act="' + act + '" data-v="' + esc(it.v) + '">' +
      esc(it.label) + (it.n != null ? ' <span class="n">' + it.n + "</span>" : "") + "</button>";
  }).join("") + "</div>";
  h += '<div class="sheet-actions"><button class="btn ghost" data-act="' + act + '" data-v="*">Deseleziona tutto</button>' +
    '<button class="btn" data-act="closesheet">Fatto</button></div>';
  var sameOpen = !!sheetEl && sheetEl.dataset.pick === kind;
  openSheet(h, sameOpen);
  sheetEl.dataset.pick = kind;
}
