/* ---------------- notifiche programmate ---------------- */
/* Il telefono si iscrive al server (Cloudflare Worker) e gli manda l'elenco delle sue notifiche.
   Il server le spedisce all'ora giusta; il testo delle "predefinite" lo sceglie il service worker
   in base a cosa hai già fatto oggi. */

function idbOpen() {
  return new Promise(function (resolve, reject) {
    var r = indexedDB.open("wk-sw", 1);
    r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
    r.onsuccess = function () { resolve(r.result); };
    r.onerror = function () { reject(r.error); };
  });
}
// il service worker non può leggere localStorage: gli lascio qui ultimo giorno attivo e streak
function syncSwState() {
  try {
    if (!("indexedDB" in window)) return;
    idbOpen().then(function (db) {
      var tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put({ lastDay: store.stats.lastDay || null, streak: store.stats.streak || 0, updated: Date.now() }, "state");
    }).catch(function () {});
  } catch (e) {}
}

function pushSupported() { return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function isIOS() { return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); }
function isStandalone() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
}
function b64uToUint8(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  var b = atob(s), o = new Uint8Array(b.length);
  for (var i = 0; i < b.length; i++) o[i] = b.charCodeAt(i);
  return o;
}
function pushPost(path, body) {
  return fetch(PUSH_SERVER_URL.replace(/\/+$/, "") + path, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
  }).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || ("errore " + r.status));
      return j;
    });
  });
}
function getPushSub(create) {
  return navigator.serviceWorker.ready.then(function (reg) {
    return reg.pushManager.getSubscription().then(function (sub) {
      if (sub || !create) return sub;
      return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToUint8(VAPID_PUBLIC_KEY) });
    });
  });
}
function syncNotifs() {
  return getPushSub(true).then(function (sub) {
    var tz = "Europe/Rome";
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch (e) {}
    return pushPost("/sync", {
      subscription: sub.toJSON(), tz: tz,
      reminders: store.notif.reminders.map(function (r) {
        return { id: r.id, time: r.time, kind: r.kind, text: r.text || "", on: r.on !== false };
      })
    });
  });
}
function notifReady() {
  return !!store.notif.enabled && pushSupported() && !!PUSH_SERVER_URL && Notification.permission === "granted";
}
function notifSummary() {
  var n = store.notif;
  if (!n.reminders.length) return n.enabled ? "nessuna ancora" : "disattivate";
  var on = n.reminders.filter(function (r) { return r.on !== false; }).length;
  return n.enabled ? plural(on, "attiva", "attive") : "disattivate";
}
function notifProblem() {
  if (!pushSupported()) {
    return isIOS() && !isStandalone()
      ? "Su iPhone le notifiche funzionano solo dall'app installata: tocca Condividi → «Aggiungi alla schermata Home», poi apri il Kasten dalla sua icona (serve iOS 16.4 o più recente)."
      : "Questo browser non supporta le notifiche programmate. Prova con Chrome su Android, oppure con l'app installata su iPhone.";
  }
  if (!PUSH_SERVER_URL) return "Il server delle notifiche non è ancora collegato: segui GUIDA-NOTIFICHE.md e poi scrivi il suo indirizzo in PUSH_SERVER_URL dentro index.html.";
  if (Notification.permission === "denied") return "Le notifiche sono bloccate per quest'app. Riattivale dalle impostazioni del telefono (Notifiche → Wortschatzkasten) e riapri questa schermata.";
  return "";
}

  if (sheetEl) {
    if (e.key === "Escape") closeSheet();
    return;
  }
  var typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (typing) {
    if (e.key === "Enter" && document.activeElement.id === "quizInput" && qz && !qz.picked) {
      e.preventDefault(); ACTIONS.checkwrite();
    }
    return;
  }
  if (state.tab === "ripasso" && rv) {
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); ACTIONS.flip(); }
    else if (rv.flipped && ["1", "2", "3"].indexOf(e.key) !== -1) ACTIONS.grade(String(+e.key - 1));
    else if (e.key === "ArrowRight" && !rv.flipped) ACTIONS.flip();
  } else if (state.tab === "quiz" && qz && qz.q) {
    if (qz.picked && (e.key === " " || e.key === "Enter")) { e.preventDefault(); ACTIONS.nextq(); }
    else if (!qz.picked && qz.q.options) {
      var n = +e.key;
      if (n >= 1 && n <= qz.q.options.length) ACTIONS.answer(qz.q.options[n - 1].id);
    }
  }
});

  if (touchX === null) return;
  var dx = e.changedTouches[0].clientX - touchX;
  var dy = e.changedTouches[0].clientY - touchY;
  touchX = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 50) return;
  if (!rv) return;
  if (!rv.flipped) { ACTIONS.flip(); return; }
  ACTIONS.grade(dx < 0 ? "0" : "2");
});

document.addEventListener("change", function (e) {
  if (e.target.id !== "importFile") return;
  var file = e.target.files && e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function () {
    var d = null;
    try { d = JSON.parse(reader.result); } catch (err) { d = null; }
    if (!d || typeof d !== "object" || d.app !== "wortschatzkasten") { toast("Questo file non è un backup del Kasten."); return; }
    openImport(d);
  };
  reader.readAsText(file);
  e.target.value = "";
});

/* ---------------- caricamento del lessico ---------------- */

function loadVocab(manual) {
  fetch("vocab-data.json", { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
    .then(function (data) {
      var before = db.official.length;
      db.official = data.items || [];
      db.officialTopics = data.topics || [];
      state.loadStatus = "ok";
      lsSet("wk_vocab_cache", data);
      autoAddNewWords();
      render();
      backupCheck();
      if (manual) {
        var diff = db.official.length - before;
        toast(diff > 0 ? plural(diff, "parola nuova", "parole nuove") + " dal lessico di classe." : "Il lessico è già aggiornato.");
      }
    })
    .catch(function () {
      var cached = lsGet("wk_vocab_cache", null);
      if (cached && !db.official.length) {
        db.official = cached.items || [];
        db.officialTopics = cached.topics || [];
        state.loadStatus = "cache";
      } else if (!db.official.length) {
        state.loadStatus = "error";
      }
      render();
      if (manual) toast("Nessuna connessione: sto usando la copia salvata.");
    });
}

/* ---------------- avvio ---------------- */

applyTheme();
// le scorciatoie dell'icona (index.html#ripasso) aprono direttamente la sezione
var hash = (location.hash || "").replace("#", "");
if (["lessico", "ripasso", "quiz", "progressi"].indexOf(hash) !== -1) state.tab = hash;

var cachedStart = lsGet("wk_vocab_cache", null);
if (cachedStart) {
  db.official = cachedStart.items || [];
  db.officialTopics = cachedStart.topics || [];
  state.loadStatus = "cache";
}
autoAddNewWords();
render();
loadVocab(false);
backupCheck();
setInterval(function () { backupCheck(); autoAddNewWords(); }, 60000);
syncSwState();
if (notifReady()) syncNotifs().catch(function () {}); // tiene aggiornati server e fuso orario

if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("service-worker.js").catch(function () {});
  });
}

})();
</script>
